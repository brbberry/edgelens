<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EdgeLens</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script defer src="/assets/perf.js"></script>
  <script defer src="/assets/app.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>EdgeLens</h1>
      <p class="subtitle">System telemetry, read directly from collector storage.</p>
    </div>
    <div class="controls">
      <label for="host">Host</label>
      <select id="host" aria-label="Select host"></select>
    </div>
  </header>

  <main>
    <nav class="tabs" aria-label="Dashboard views" role="tablist">
      <button class="tab active" type="button" role="tab" aria-selected="true" data-view="host-view">Host telemetry</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-view="run-view">Experiments</button>
    </nav>

    <section id="host-view" class="view" role="tabpanel">
      <p id="status" class="status">Loading measurements...</p>
      <section id="charts" class="grid" aria-live="polite"></section>
    </section>

    <section id="run-view" class="view" role="tabpanel" hidden>
      <div class="run-toolbar">
        <label for="run-select">Experiment run</label>
        <select id="run-select" aria-label="Select experiment run"></select>
      </div>
      <p id="run-status" class="status">Loading experiments...</p>

      <div id="run-content" hidden>
        <section class="run-detail" aria-label="Experiment evidence">
          <dl id="run-facts" class="facts"></dl>

          <div class="evidence">
            <div class="perf-heading">
              <h2>Perf counters</h2>
              <span id="perf-count" class="perf-count"></span>
            </div>
            <p id="perf-summary" class="perf-summary">Loading counter evidence...</p>
            <div id="perf-notes" class="perf-notes" hidden></div>
            <div id="perf-counters" class="perf-grid"></div>
            <details id="perf-raw" class="perf-raw">
              <summary>View technical raw perf CSV</summary>
              <pre id="perf-output">No perf-stat artifact.</pre>
            </details>

            <h2>Sampled stacks</h2>
            <svg id="flame" role="img" aria-label="CPU flame chart"></svg>

            <h2>Go heap profile summary</h2>
            <pre id="heap-output">No heap profile artifact.</pre>
          </div>
        </section>

        <section class="timeline" aria-labelledby="timeline-heading">
          <h2 id="timeline-heading" class="section-title">Process timeline</h2>
          <div id="process-charts" class="grid"></div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
