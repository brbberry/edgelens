<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EdgeLens</title>
  <style>
    :root { --ink: #17242b; --muted: #617078; --paper: #f5f3ed; --panel: #fffefa; --line: #d6d9d3; --teal: #007a78; --orange: #e56b2f; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: linear-gradient(135deg, #f5f3ed 0%, #eef4f0 100%); font-family: "Avenir Next", "Helvetica Neue", sans-serif; }
    header, main { width: min(1440px, calc(100% - 32px)); margin: 0 auto; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding: 42px 0 28px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: 0; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .controls { display: flex; align-items: center; gap: 10px; }
    label { color: var(--muted); font-size: 13px; font-weight: 600; }
    select { min-width: 150px; border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; color: var(--ink); background: var(--panel); font: inherit; }
    main { padding: 24px 0 44px; }
    .status { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    .chart { min-height: 224px; border: 1px solid var(--line); border-radius: 6px; padding: 16px; background: var(--panel); box-shadow: 0 1px 0 rgb(23 36 43 / 4%); }
    .chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0; }
    .value { color: var(--teal); font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 13px; font-weight: 650; white-space: nowrap; }
    svg { display: block; width: 100%; height: 156px; margin-top: 14px; overflow: visible; }
    .grid-line { stroke: #e5e6e0; stroke-width: 1; }
    .axis-line { stroke: #9aa6a5; stroke-width: 1; }
    .trend { fill: none; stroke: var(--teal); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .axis-label { fill: var(--muted); font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 10px; }
    .empty { grid-column: 1 / -1; padding: 52px 18px; border: 1px dashed var(--line); color: var(--muted); text-align: center; }
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
    .tab { border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; color: var(--muted); background: transparent; font: inherit; font-weight: 650; cursor: pointer; }
    .tab.active { color: var(--ink); border-bottom-color: var(--orange); }
    .view[hidden] { display: none; }
    .run-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .run-toolbar select { flex: 1; max-width: 620px; }
    .run-detail { display: grid; grid-template-columns: minmax(240px, 340px) 1fr; gap: 24px; margin-bottom: 24px; }
    .facts { margin: 0; display: grid; grid-template-columns: auto 1fr; align-content: start; gap: 8px 14px; }
    .facts dt { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 13px; }
    .evidence { min-width: 0; }
    .evidence h2, .timeline h2 { margin-bottom: 10px; }
    .perf-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .perf-heading h2 { margin-bottom: 0; }
    .perf-count { color: var(--muted); font-size: 12px; font-weight: 650; }
    .perf-summary { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .perf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 9px; margin-bottom: 10px; }
    .perf-counter { min-width: 0; border: 1px solid var(--line); border-left: 3px solid var(--teal); border-radius: 6px; padding: 12px; background: var(--panel); }
    .perf-counter.unavailable { border-left-color: #9aa6a5; color: var(--muted); }
    .perf-counter-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .perf-counter-name { min-width: 0; font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
    .perf-scope { flex: none; border: 1px solid #b8cfca; border-radius: 3px; padding: 1px 5px; color: #34645e; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .perf-counter-value { display: block; margin-top: 8px; color: var(--ink); font: 700 22px/1.15 ui-monospace, "SFMono-Regular", monospace; }
    .perf-derived { min-height: 18px; margin-top: 3px; color: var(--teal); font: 650 12px/1.35 ui-monospace, "SFMono-Regular", monospace; }
    .perf-description { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .perf-raw { margin-bottom: 18px; }
    .perf-raw summary { width: fit-content; padding: 4px 0; color: var(--muted); font-size: 12px; font-weight: 650; cursor: pointer; }
    .perf-raw pre { margin: 6px 0 0; }
    pre { max-height: 300px; margin: 0 0 18px; overflow: auto; border: 1px solid var(--line); border-radius: 5px; padding: 12px; background: #152126; color: #e9f1ec; font: 12px/1.5 ui-monospace, "SFMono-Regular", monospace; white-space: pre-wrap; }
    #flame { width: 100%; min-height: 120px; height: auto; margin: 0 0 18px; border: 1px solid var(--line); background: var(--panel); }
    .flame-label { fill: #17242b; font: 10px ui-monospace, "SFMono-Regular", monospace; pointer-events: none; }
    .section-title { margin: 26px 0 12px; font-size: 18px; }
    .badge { display: inline-block; border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; font-family: inherit; font-size: 11px; font-weight: 700; }
    .badge.completed { color: #11623b; border-color: #85bda0; }
    .badge.failed, .badge.interrupted { color: #9c321e; border-color: #dba08f; }
    @media (max-width: 600px) { header { align-items: start; flex-direction: column; padding-top: 26px; } h1 { font-size: 29px; } .controls { width: 100%; justify-content: space-between; } }
    @media (max-width: 800px) { .run-detail { grid-template-columns: 1fr; } .run-toolbar { align-items: stretch; flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <div><h1>EdgeLens</h1><p class="subtitle">System telemetry, read directly from collector storage.</p></div>
    <div class="controls"><label for="host">Host</label><select id="host" aria-label="Select host"></select></div>
  </header>
  <main>
    <nav class="tabs" aria-label="Dashboard views"><button class="tab active" data-view="host-view">Host telemetry</button><button class="tab" data-view="run-view">Experiments</button></nav>
    <section id="host-view" class="view"><p id="status" class="status">Loading measurements...</p><section id="charts" class="grid" aria-live="polite"></section></section>
    <section id="run-view" class="view" hidden>
      <div class="run-toolbar"><label for="run-select">Experiment run</label><select id="run-select" aria-label="Select experiment run"></select></div>
      <p id="run-status" class="status">Loading experiments...</p>
      <div id="run-content" hidden>
        <section class="run-detail"><dl id="run-facts" class="facts"></dl><div class="evidence"><div class="perf-heading"><h2>Perf counters</h2><span id="perf-count" class="perf-count"></span></div><p id="perf-summary" class="perf-summary">Loading counter evidence...</p><div id="perf-counters" class="perf-grid"></div><details id="perf-raw" class="perf-raw"><summary>View raw perf output</summary><pre id="perf-output">No perf-stat artifact.</pre></details><h2>Sampled stacks</h2><svg id="flame" role="img" aria-label="CPU flame chart"></svg><h2>Go heap profile summary</h2><pre id="heap-output">No heap profile artifact.</pre></div></section>
        <section class="timeline"><h2 class="section-title">Process timeline</h2><div id="process-charts" class="grid"></div></section>
      </div>
    </section>
  </main>
  <script>
    const metrics = [
      ["cpu_pct", "CPU usage", "%"], ["mem_used_pct", "Memory usage", "%"], ["mem_used_b", "Memory used", "B"],
      ["mem_total_b", "Memory total", "B"], ["swap_used_pct", "Swap usage", "%"], ["disk_used_pct", "Disk usage", "%"],
      ["disk_read_bps", "Disk read", "B/s"], ["disk_write_bps", "Disk write", "B/s"], ["net_recv_bps", "Network received", "B/s"],
      ["net_sent_bps", "Network sent", "B/s"], ["temp_c", "Temperature", "C"]
    ];
    const hostSelect = document.querySelector("#host");
    const chartGrid = document.querySelector("#charts");
    const status = document.querySelector("#status");
    const runSelect = document.querySelector("#run-select");
    const runStatus = document.querySelector("#run-status");
    const runContent = document.querySelector("#run-content");
    const runFacts = document.querySelector("#run-facts");
    const processCharts = document.querySelector("#process-charts");
    const perfCounters = document.querySelector("#perf-counters");
    const perfCount = document.querySelector("#perf-count");
    const perfSummary = document.querySelector("#perf-summary");
    const perfRaw = document.querySelector("#perf-raw");
    const perfOutput = document.querySelector("#perf-output");
    const heapOutput = document.querySelector("#heap-output");
    const flame = document.querySelector("#flame");
    let measurements = [];
    let runs = [];

    function format(value, unit) {
      if (unit === "B" || unit === "B/s") {
        const units = ["B", "KB", "MB", "GB", "TB"];
        let index = 0;
        while (Math.abs(value) >= 1024 && index < units.length - 1) { value /= 1024; index++; }
        return `${value.toFixed(value >= 10 ? 0 : 1)} ${units[index]}${unit === "B/s" ? "/s" : ""}`;
      }
	  if (unit === "count") return Math.round(value).toLocaleString();
      return `${value.toFixed(1)}${unit === "%" ? "%" : " C"}`;
    }

    function chart(metric, records) {
      const [field, label, unit] = metric;
      const values = records.map(record => Number(record[field]));
      const minimum = Math.min(...values);
      const maximum = Math.max(...values);
      const padding = (maximum - minimum) * 0.1 || Math.max(Math.abs(maximum) * 0.1, 1);
      const low = minimum - padding;
      const high = maximum + padding;
      const range = high - low;
      const width = 300, height = 156, left = 46, right = 8, top = 12, bottom = 28;
      const firstTimestamp = records[0].ts;
      const lastTimestamp = records.at(-1).ts;
      const timeRange = lastTimestamp - firstTimestamp;
      const plotHeight = height - top - bottom;
      const plotWidth = width - left - right;
      const points = records.map((record, index) => {
        const value = values[index];
        const x = left + plotWidth * (timeRange ? (record.ts - firstTimestamp) / timeRange : .5);
        const y = top + (height - top - bottom) * (1 - (value - low) / range);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      const firstTime = new Date(firstTimestamp * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const lastTime = new Date(lastTimestamp * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const middleY = top + plotHeight / 2;
      const bottomY = height - bottom;
      return `<article class="chart"><div class="chart-head"><h2>${label}</h2><span class="value">${format(values.at(-1), unit)}</span></div><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${label} trend"><line class="grid-line" x1="${left}" y1="${top}" x2="${width - right}" y2="${top}"/><line class="grid-line" x1="${left}" y1="${middleY}" x2="${width - right}" y2="${middleY}"/><line class="grid-line" x1="${left}" y1="${bottomY}" x2="${width - right}" y2="${bottomY}"/><line class="axis-line" x1="${left}" y1="${top}" x2="${left}" y2="${bottomY}"/><line class="axis-line" x1="${left}" y1="${bottomY}" x2="${width - right}" y2="${bottomY}"/><polyline class="trend" points="${points}"/><text class="axis-label" x="${left - 5}" y="${top + 3}" text-anchor="end">${format(high, unit)}</text><text class="axis-label" x="${left - 5}" y="${middleY + 3}" text-anchor="end">${format((low + high) / 2, unit)}</text><text class="axis-label" x="${left - 5}" y="${bottomY + 3}" text-anchor="end">${format(low, unit)}</text><text class="axis-label" x="${left}" y="${height - 5}">${firstTime}</text><text class="axis-label" x="${width - right}" y="${height - 5}" text-anchor="end">${lastTime}</text></svg></article>`;
    }

    function render() {
      const records = measurements.filter(record => record.host === hostSelect.value);
      if (!records.length) { chartGrid.innerHTML = '<div class="empty">No measurements available for this host yet.</div>'; return; }
      chartGrid.innerHTML = metrics.map(metric => chart(metric, records)).join("");
      const latest = records.at(-1);
      status.textContent = `${records.length} samples from ${latest.host} through ${new Date(latest.ts * 1000).toLocaleString()}.`;
    }

    function populateHosts(hosts) {
      hostSelect.replaceChildren(...hosts.map(host => {
        const option = document.createElement("option");
        option.value = host;
        option.textContent = host;
        return option;
      }));
    }

    function fact(label, value) {
      const term = document.createElement("dt"); term.textContent = label;
      const detail = document.createElement("dd");
      if (label === "Status") { const badge = document.createElement("span"); badge.className = `badge ${value}`; badge.textContent = value; detail.append(badge); }
      else detail.textContent = value;
      runFacts.append(term, detail);
    }

    async function optionalArtifact(runID, kind) {
      const response = await fetch(`/api/runs/${encodeURIComponent(runID)}/artifacts/${kind}`);
      if (response.status === 404) return null;
      if (!response.ok) throw new Error(`Unable to load ${kind} artifact`);
      return response.json();
    }

    const perfCounterInfo = {
      "task-clock": ["Task clock", "CPU time during which the workload was scheduled. Compare CPU utilization with 1.0 for one fully occupied core."],
      "cpu-clock": ["CPU clock", "Software CPU time consumed by the workload."],
      "cycles": ["CPU cycles", "Processor clock cycles spent running the workload. Use with instructions to understand CPU efficiency."],
      "instructions": ["Instructions", "Machine instructions retired by the CPU. Perf may also report instructions per cycle (IPC)."],
      "branches": ["Branches", "Branch instructions executed by the workload."],
      "branch-instructions": ["Branches", "Branch instructions executed by the workload."],
      "branch-misses": ["Branch misses", "Branches the CPU predicted incorrectly. A high miss percentage can waste pipeline work."],
      "cache-references": ["Cache references", "Last-level cache accesses observed for the workload."],
      "cache-misses": ["Cache misses", "Last-level cache accesses that missed. A high percentage can indicate poor memory locality."],
      "context-switches": ["Context switches", "Times the scheduler switched execution to or from this workload."],
      "cpu-migrations": ["CPU migrations", "Times the scheduler moved the workload between CPU cores."],
      "page-faults": ["Page faults", "Memory pages mapped on demand. Most are inexpensive minor faults unless data must be read from storage."],
      "minor-faults": ["Minor page faults", "Page mappings resolved without reading data from storage."],
      "major-faults": ["Major page faults", "Page mappings that required storage I/O and may cause visible stalls."]
    };

    function parsePerfStat(text) {
      if (!text) return [];
      return text.split("\n").flatMap(line => {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith("#")) return [];
        const fields = line.split(",").map(field => field.trim());
        if (fields.length < 3 || !fields[2]) return [];
        const event = fields[2];
        const modifierMatch = event.match(/:([ukh]+)$/i);
        return [{
          rawValue: fields[0], unit: fields[1], event,
          name: event.replace(/:([ukh]+)$/i, ""),
          modifiers: modifierMatch?.[1].toLowerCase() || "",
          enabledPercent: Number(fields[4]),
          metricValue: fields[5], metricUnit: fields.slice(6).join(", ")
        }];
      });
    }

    function perfScope(modifiers) {
      const scopes = [];
      if (modifiers.includes("u")) scopes.push("user");
      if (modifiers.includes("k")) scopes.push("kernel");
      if (modifiers.includes("h")) scopes.push("hypervisor");
      return scopes.join(" + ") || "all";
    }

    function formatPerfValue(rawValue, unit) {
      if (!rawValue || rawValue.startsWith("<")) return rawValue || "Unavailable";
      const value = Number(rawValue.replaceAll(" ", ""));
      if (!Number.isFinite(value)) return rawValue;
      if (unit === "msec" && value >= 1000) return `${(value / 1000).toFixed(3)} s`;
      if (unit) return `${value.toLocaleString(undefined, { maximumFractionDigits: 3 })} ${unit}`;
      return new Intl.NumberFormat(undefined, { notation: Math.abs(value) >= 100000 ? "compact" : "standard", maximumFractionDigits: 2 }).format(value);
    }

    function formatPerfMetric(valueText, unit) {
      const value = Number(valueText);
      if (!Number.isFinite(value) || !unit) return "";
      const formatted = value.toLocaleString(undefined, { maximumFractionDigits: 3 });
      return unit === "/sec" ? `${formatted} per second` : `${formatted} ${unit}`;
    }

    function renderPerf(text) {
      perfOutput.textContent = text || "No perf-stat artifact.";
      perfRaw.hidden = !text;
      perfRaw.open = false;
      const counters = parsePerfStat(text);
      perfCounters.replaceChildren();
      perfCount.textContent = counters.length ? `${counters.length} collected` : "";
      if (!counters.length) {
        perfSummary.textContent = "No perf counter artifact is available for this run.";
        const empty = document.createElement("div"); empty.className = "empty"; empty.textContent = "No counters recorded."; perfCounters.append(empty);
        return;
      }

      const insights = [`${counters.length} counters collected`];
      const taskClock = counters.find(counter => counter.name === "task-clock");
      const utilization = Number(taskClock?.metricValue);
      if (Number.isFinite(utilization) && taskClock.metricUnit.includes("CPUs utilized")) insights.push(`${utilization.toFixed(2)} CPU cores utilized on average`);
      const instructions = counters.find(counter => counter.name === "instructions");
      const ipc = Number(instructions?.metricValue);
      if (Number.isFinite(ipc) && instructions.metricUnit.includes("insn per cycle")) insights.push(`${ipc.toFixed(2)} instructions per cycle`);
      perfSummary.textContent = `${insights.join(" · ")}. Values are workload totals; rates and ratios are calculated by perf.`;

      for (const counter of counters) {
        const unavailable = !counter.rawValue || counter.rawValue.startsWith("<");
        const [label, description] = perfCounterInfo[counter.name] || [counter.name, "A Linux perf event selected for this experiment."];
        const article = document.createElement("article"); article.className = `perf-counter${unavailable ? " unavailable" : ""}`;
        const heading = document.createElement("div"); heading.className = "perf-counter-head";
        const name = document.createElement("span"); name.className = "perf-counter-name"; name.textContent = label;
        const scope = document.createElement("span"); scope.className = "perf-scope"; scope.textContent = perfScope(counter.modifiers); scope.title = "Execution privilege levels included in this counter";
        heading.append(name, scope);
        const value = document.createElement("strong"); value.className = "perf-counter-value"; value.textContent = formatPerfValue(counter.rawValue, counter.unit); value.title = counter.unit ? `${counter.rawValue} ${counter.unit}` : counter.rawValue;
        const derived = document.createElement("div"); derived.className = "perf-derived"; derived.textContent = formatPerfMetric(counter.metricValue, counter.metricUnit) || (Number.isFinite(counter.enabledPercent) && counter.enabledPercent < 100 ? `${counter.enabledPercent.toFixed(1)}% time enabled` : "");
        const explanation = document.createElement("p"); explanation.className = "perf-description"; explanation.textContent = description;
        article.append(heading, value, derived, explanation); perfCounters.append(article);
      }
    }

    function renderFlame(folded) {
      flame.replaceChildren();
      if (!folded) { flame.setAttribute("viewBox", "0 0 900 120"); return; }
      const root = { name: "all samples", count: 0, children: new Map() };
      let maximumDepth = 1;
      for (const line of folded.trim().split("\n")) {
        const split = line.lastIndexOf(" ");
        if (split < 1) continue;
        const count = Number(line.slice(split + 1));
        const stack = line.slice(0, split).split(";");
        if (!Number.isFinite(count) || count <= 0) continue;
        root.count += count; maximumDepth = Math.max(maximumDepth, stack.length);
        let node = root;
        for (const name of stack) {
          if (!node.children.has(name)) node.children.set(name, { name, count: 0, children: new Map() });
          node = node.children.get(name); node.count += count;
        }
      }
      const width = 900, rowHeight = 24, height = (maximumDepth + 1) * rowHeight;
      flame.setAttribute("viewBox", `0 0 ${width} ${height}`);
      const namespace = "http://www.w3.org/2000/svg";
      function color(name) { let hash = 0; for (const char of name) hash = (hash * 31 + char.charCodeAt(0)) | 0; return `hsl(${Math.abs(hash) % 330} 58% 68%)`; }
      function draw(node, x, y, nodeWidth) {
        const children = [...node.children.values()].sort((a, b) => b.count - a.count);
        let offset = x;
        for (const child of children) {
          const childWidth = nodeWidth * child.count / node.count;
          const rect = document.createElementNS(namespace, "rect");
          rect.setAttribute("x", offset); rect.setAttribute("y", height - y - rowHeight); rect.setAttribute("width", Math.max(0, childWidth - .5)); rect.setAttribute("height", rowHeight - 1); rect.setAttribute("fill", color(child.name));
          const title = document.createElementNS(namespace, "title"); title.textContent = `${child.name}: ${child.count} samples`; rect.append(title); flame.append(rect);
          if (childWidth > 72) { const text = document.createElementNS(namespace, "text"); text.setAttribute("x", offset + 4); text.setAttribute("y", height - y - 8); text.setAttribute("class", "flame-label"); text.textContent = child.name.slice(0, Math.floor(childWidth / 7)); flame.append(text); }
          draw(child, offset, y + rowHeight, childWidth); offset += childWidth;
        }
      }
      if (root.count) draw(root, 0, 0, width);
    }

    async function renderRun() {
      const id = runSelect.value;
      if (!id) { runContent.hidden = true; runStatus.textContent = "No experiment runs recorded."; return; }
      runStatus.textContent = "Loading experiment evidence...";
      try {
        const [runResponse, sampleResponse, perfArtifact, flameArtifact, heapArtifact] = await Promise.all([
          fetch(`/api/runs/${encodeURIComponent(id)}`),
          fetch(`/api/runs/${encodeURIComponent(id)}/process-samples?limit=10000`),
          optionalArtifact(id, "perf-stat"), optionalArtifact(id, "flame-folded"), optionalArtifact(id, "heap-summary")
        ]);
        if (!runResponse.ok || !sampleResponse.ok) throw new Error("Unable to load experiment details");
        const run = await runResponse.json(); const samples = await sampleResponse.json();
        runFacts.replaceChildren();
        fact("Status", run.status); fact("Command", [run.command, ...run.args].join(" ")); fact("Host / PID", `${run.host} / ${run.child_pid}`);
        fact("Started", new Date(run.started_at_ms).toLocaleString()); fact("Finished", run.finished_at_ms ? new Date(run.finished_at_ms).toLocaleString() : "running");
        fact("Elapsed", run.elapsed_ns == null ? "running" : `${(run.elapsed_ns / 1e9).toFixed(3)} s`); fact("Perf events", run.capture.perf_events.join(", "));
        fact("Perf version", run.perf_version || "not reported"); if (run.failure_reason) fact("Failure", run.failure_reason);
        renderPerf(perfArtifact?.text || ""); heapOutput.textContent = heapArtifact?.text || "No Go heap profile artifact."; renderFlame(flameArtifact?.text || "");
        const timeline = samples.map(sample => ({ ...sample, ts: sample.sampled_at_ms / 1000 }));
        const processMetrics = [["cpu_percent", "Process CPU", "%"], ["rss_bytes", "Resident memory", "B"], ["heap_data_bytes", "Data/heap mapping", "B"], ["read_bps", "Process reads", "B/s"], ["write_bps", "Process writes", "B/s"], ["thread_count", "Threads", "count"], ["minor_faults", "Minor page faults", "count"], ["major_faults", "Major page faults", "count"]];
        processCharts.innerHTML = timeline.length ? processMetrics.map(metric => chart(metric, timeline)).join("") : '<div class="empty">The process exited before a sample was captured.</div>';
        runStatus.textContent = `${samples.length} process samples. Artifacts are checksum-verified by the collector.`; runContent.hidden = false;
      } catch (error) { runStatus.textContent = error.message; runContent.hidden = true; }
    }

    async function load() {
      try {
        const [measurementResponse, runResponse] = await Promise.all([fetch("/api/measurements?limit=720"), fetch("/api/runs?limit=500")]);
        if (!measurementResponse.ok || !runResponse.ok) throw new Error("Unable to load dashboard data");
        measurements = await measurementResponse.json(); runs = await runResponse.json();
        const hosts = [...new Set(measurements.map(record => record.host))];
        populateHosts(hosts);
        hostSelect.addEventListener("change", render);
        render();
        runSelect.replaceChildren(...runs.map(run => { const option = document.createElement("option"); option.value = run.id; option.textContent = `${new Date(run.started_at_ms).toLocaleString()} · ${run.command} · ${run.status}`; return option; }));
        runSelect.addEventListener("change", renderRun); renderRun();
      } catch (error) { status.textContent = error.message; chartGrid.innerHTML = '<div class="empty">The dashboard could not load telemetry.</div>'; }
    }
    document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(item => item.classList.toggle("active", item === tab));
      document.querySelectorAll(".view").forEach(view => view.hidden = view.id !== tab.dataset.view);
    }));
    load();
  </script>
</body>
</html>
